apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.global.namespace | quote }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.global.namespace | quote }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.global.namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ .Chart.Name | quote }}
    namespace: {{ .Values.global.namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Chart.Name | quote }}
