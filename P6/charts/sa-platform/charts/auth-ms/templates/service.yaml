apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name | quote }}
  namespace: {{ .Values.global.namespace | quote }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
