apiVersion: v2
name: sa-platform
description: Plataforma de microservicios de la Practica 6 desplegada en Amazon EKS
type: application
icon: https://kubernetes.io/images/favicon.png
version: 0.3.0
appVersion: "1.2.0"
dependencies:
  - name: api-gateway
    version: 0.1.0
    repository: file://charts/api-gateway
  - name: auth-ms
    version: 0.1.0
    repository: file://charts/auth-ms
  - name: catalog-ms
    version: 0.1.0
    repository: file://charts/catalog-ms
  - name: orders-ms
    version: 0.1.0
    repository: file://charts/orders-ms
  - name: payments-ms
    version: 0.1.0
    repository: file://charts/payments-ms
  - name: rabbitmq
    version: 16.0.14
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: rabbitmq.enabled
  - name: postgresql
    alias: auth-database
    version: 18.8.13
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: auth-database.enabled
  - name: postgresql
    alias: catalog-database
    version: 18.8.13
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: catalog-database.enabled
  - name: postgresql
    alias: orders-database
    version: 18.8.13
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: orders-database.enabled
  - name: postgresql
    alias: payments-database
    version: 18.8.13
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: payments-database.enabled
