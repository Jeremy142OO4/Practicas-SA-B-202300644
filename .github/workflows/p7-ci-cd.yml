name: P7 CI-CD

on:
  push:
    branches: [main, develop]
    paths: ["P4/**", "P5/cronjobs/**", "P6/**", "P7/**", ".github/workflows/p7-ci-cd.yml"]
  pull_request:
    branches: [main]
    paths: ["P4/**", "P5/cronjobs/**", "P6/**", "P7/**", ".github/workflows/p7-ci-cd.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: Desplegar en GKE después de publicar las imágenes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/sa-p7

jobs:
  build:
    name: Build - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            language: go
            context: P4/api-gateway
          - service: auth-ms
            language: go
            context: P4/auth-ms
          - service: catalog-ms
            language: go
            context: P4/catalog-ms
          - service: orders-ms
            language: python
            context: P4/orders-ms
          - service: payments-ms
            language: python
            context: P4/payments-ms
          - service: scheduled-jobs
            language: python
            context: P5/cronjobs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        if: matrix.language == 'go'
        with:
          go-version-file: ${{ matrix.context }}/go.mod
          cache-dependency-path: ${{ matrix.context }}/go.sum
      - name: Compilar servicio Go
        if: matrix.language == 'go'
        working-directory: ${{ matrix.context }}
        run: go build ./...
      - uses: actions/setup-python@v6
        if: matrix.language == 'python'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ${{ matrix.context }}/requirements.txt
      - name: Validar servicio Python
        if: matrix.language == 'python'
        run: |
          python -m pip install -r ${{ matrix.context }}/requirements.txt
          python -m compileall -q ${{ matrix.context }}

  test:
    name: Test - ${{ matrix.category }} (${{ matrix.weight }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: unit
            weight: 70%
          - category: integration
            weight: 20%
          - category: e2e
            weight: 10%
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: P7/requirements-ci.txt
      - name: Instalar herramientas de prueba
        run: python -m pip install -r P7/requirements-ci.txt
      - name: Verificar distribución 70-20-10
        run: python P7/scripts/verificar_distribucion_pruebas.py
      - name: Ejecutar pruebas ${{ matrix.category }}
        working-directory: P7
        run: pytest -m "${{ matrix.category }}" -v

  publish:
    name: Docker - ${{ matrix.service }}
    needs: [build, test]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: P4/api-gateway
          - service: auth-ms
            context: P4/auth-ms
          - service: catalog-ms
            context: P4/catalog-ms
          - service: orders-ms
            context: P4/orders-ms
          - service: payments-ms
            context: P4/payments-ms
          - service: scheduled-jobs
            context: P5/cronjobs
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.prod
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ matrix.service }}-${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:${{ matrix.service }}-latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy - GKE
    needs: publish
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_ZONE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
      - uses: azure/setup-helm@v4
      - name: Preparar valores protegidos de Helm
        shell: bash
        env:
          P7_VALUES_YAML: ${{ secrets.P7_VALUES_YAML }}
        run: |
          test -n "$P7_VALUES_YAML"
          printf '%s' "$P7_VALUES_YAML" > "$RUNNER_TEMP/p7-values.yaml"
      - name: Desplegar imágenes validadas
        run: |
          helm dependency update P6/charts/sa-platform
          helm upgrade --install sa-platform P6/charts/sa-platform \
            --namespace sa-p7 --create-namespace \
            --values "$RUNNER_TEMP/p7-values.yaml" \
            --set global.namespace=sa-p7 \
            --set-json 'global.imagePullSecrets=[]' \
            --set rabbitmq.namespaceOverride=sa-p7 \
            --set api-gateway.enabled=true \
            --set auth-ms.enabled=true \
            --set catalog-ms.enabled=true \
            --set orders-ms.enabled=true \
            --set payments-ms.enabled=true \
            --set api-gateway.resources.requests.cpu=10m \
            --set auth-ms.resources.requests.cpu=10m \
            --set catalog-ms.resources.requests.cpu=10m \
            --set orders-ms.resources.requests.cpu=10m \
            --set payments-ms.resources.requests.cpu=10m \
            --set-string api-gateway.image.repository="${IMAGE_REPOSITORY}" \
            --set-string auth-ms.image.repository="${IMAGE_REPOSITORY}" \
            --set-string catalog-ms.image.repository="${IMAGE_REPOSITORY}" \
            --set-string orders-ms.image.repository="${IMAGE_REPOSITORY}" \
            --set-string payments-ms.image.repository="${IMAGE_REPOSITORY}" \
            --set-string scheduled-jobs.image.repository="${IMAGE_REPOSITORY}" \
            --set-string api-gateway.image.tag="api-gateway-${GITHUB_SHA}" \
            --set-string auth-ms.image.tag="auth-ms-${GITHUB_SHA}" \
            --set-string catalog-ms.image.tag="catalog-ms-${GITHUB_SHA}" \
            --set-string orders-ms.image.tag="orders-ms-${GITHUB_SHA}" \
            --set-string payments-ms.image.tag="payments-ms-${GITHUB_SHA}" \
            --set-string scheduled-jobs.image.tag="scheduled-jobs-${GITHUB_SHA}" \
            --wait --timeout 12m
          kubectl -n sa-p7 rollout status deployment --all --timeout=5m
          rm -f "$RUNNER_TEMP/p7-values.yaml"
