{{- range $name, $values := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Values.namespace | quote }}
  labels:
    {{- include "sa-platform.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $values }}
  {{ $key }}: {{ required (printf "secrets.%s.%s es obligatorio" $name $key) $value | quote }}
  {{- end }}
{{- end }}
