{{- if dig "networkPolicies" "enabled" true .Values.global }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-ingress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: api-gateway-client
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes:
    - Egress
  egress:
    {{- range $name, $port := dict "auth-ms" 4001 "catalog-ms" 4002 "orders-ms" 4003 "payments-ms" 4004 }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name | quote }}
      ports:
        - protocol: TCP
          port: {{ $port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-client-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      access: api-gateway-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-ms-ingress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-ms
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 4001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-ms-ingress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog-ms
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders-ms
      ports:
        - protocol: TCP
          port: 4002
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-ms-ingress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-ms
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payments-ms
      ports:
        - protocol: TCP
          port: 4003
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-ms-ingress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payments-ms
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 4004
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-ms-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth-ms
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth-database
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-ms-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: catalog-ms
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-database
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-ms-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-ms
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders-database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog-ms
      ports:
        - protocol: TCP
          port: 4002
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-ms-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payments-ms
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payments-database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders-ms
      ports:
        - protocol: TCP
          port: 4003
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-ingress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - auth-database
          - catalog-database
          - orders-database
          - payments-database
  policyTypes: [Ingress]
  ingress:
    {{- range $name := list "auth" "catalog" "orders" "payments" }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ printf "%s-ms" $name | quote }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    - from:
        {{- range $name := list "execution-recorder" "summary-publisher" "summary-consumer" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders-ms
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payments-ms
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: summary-publisher
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: summary-consumer
      ports:
        - protocol: TCP
          port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-recorder-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: execution-recorder
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders-database
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: summary-publisher-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: summary-publisher
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders-database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: summary-consumer-egress
  namespace: {{ .Values.namespace | quote }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: summary-consumer
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orders-database
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: rabbitmq
      ports:
        - protocol: TCP
          port: 5672
{{- end }}
