<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e9edf3" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#52606d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#9aa5b1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="820" fill="#ffffff"/>
  <rect width="1600" height="820" fill="url(#grid)"/>

  <text x="800" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2933">
    Práctica 8 - Flujo GitOps
  </text>
  <text x="800" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#52606d">
    Del código al clúster con validaciones y canary
  </text>

  <!-- Main flow -->
  <g filter="url(#shadow)">
    <rect x="70" y="190" width="250" height="150" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <rect x="405" y="160" width="300" height="210" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <rect x="790" y="190" width="250" height="150" rx="18" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <rect x="1125" y="160" width="300" height="210" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <rect x="1150" y="500" width="350" height="200" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  </g>

  <!-- Arrows -->
  <path d="M 320 265 L 395 265" stroke="#52606d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 705 265 L 780 265" stroke="#52606d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1040 265 L 1115 265" stroke="#52606d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1275 370 L 1275 490" stroke="#52606d" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <!-- Terraform connection -->
  <rect x="515" y="550" width="280" height="110" rx="18" fill="#f3f4f6" stroke="#6b7280" stroke-width="3" filter="url(#shadow)"/>
  <path d="M 655 550 L 655 430 L 1220 430 L 1220 490" stroke="#6b7280" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <!-- Box labels -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="195" y="230" font-size="22" font-weight="700" fill="#1e3a8a">1. Código</text>
    <text x="195" y="266" font-size="18" fill="#334e68">GitHub</text>
    <text x="195" y="296" font-size="16" fill="#52606d">P4 y configuración P8</text>

    <text x="555" y="205" font-size="22" font-weight="700" fill="#166534">2. GitHub Actions</text>
    <text x="555" y="242" font-size="17" fill="#334e68">Pruebas y Helm</text>
    <text x="555" y="272" font-size="17" fill="#334e68">Terraform y Trivy</text>
    <text x="555" y="302" font-size="17" fill="#334e68">SBOM y Cosign</text>
    <text x="555" y="338" font-size="15" fill="#52606d">Solicita cambio en GitOps</text>

    <text x="915" y="230" font-size="22" font-weight="700" fill="#9a3412">3. Imágenes</text>
    <text x="915" y="266" font-size="18" fill="#334e68">GHCR</text>
    <text x="915" y="296" font-size="16" fill="#52606d">Versionadas y firmadas</text>

    <text x="1275" y="205" font-size="22" font-weight="700" fill="#5b21b6">4. Repositorio GitOps</text>
    <text x="1275" y="244" font-size="17" fill="#334e68">Manifiestos declarativos</text>
    <text x="1275" y="276" font-size="17" fill="#334e68">Rollout y políticas</text>
    <text x="1275" y="308" font-size="17" fill="#334e68">External Secrets</text>
    <text x="1275" y="344" font-size="15" fill="#52606d">Pull Request aprobado</text>

    <text x="655" y="592" font-size="22" font-weight="700" fill="#374151">Terraform</text>
    <text x="655" y="625" font-size="17" fill="#52606d">Crea clúster, namespace</text>
    <text x="655" y="650" font-size="17" fill="#52606d">cuotas, límites y RBAC</text>

    <text x="1325" y="542" font-size="22" font-weight="700" fill="#075985">5. GKE</text>
    <text x="1325" y="578" font-size="19" fill="#334e68">ArgoCD aplica</text>
    <text x="1325" y="612" font-size="19" fill="#334e68">Argo Rollouts</text>
    <text x="1325" y="646" font-size="17" fill="#334e68">10% → 30% → 60%</text>
    <text x="1325" y="680" font-size="16" fill="#b91c1c">Si falla: conserva estable</text>
  </g>

  <text x="800" y="775" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#52606d">
    ArgoCD es quien aplica los cambios; GitHub Actions no despliega directamente en el clúster.
  </text>
</svg>
